name: Build BotW IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository (gets keys/prod.keys)
        uses: actions/checkout@v4

      - name: Clone official nxnative repository
        run: git clone https://github.com/seedds/nxnative.git nxnative_src

      - name: Install dependencies via Homebrew and Python
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz "backports.zstd; python_version < '3.14'"

      - name: Download Base Game
        run: |
          mkdir -p games/botw
          echo "Downloading base game..."
          curl -L "https://drive.usercontent.google.com/download?id=1N_o0m1CdxMSSLIfIutmKNT1lhJP8KPpT&confirm=t" -o games/botw/base.nsp

      - name: Run nxnative build script
        run: |
          source venv/bin/activate
          python3 nxnative_src/scripts/build_ipa_from_nsp.py games/botw -k keys/prod.keys

      - name: Upload generated IPA as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: botw-base-ipa
          path: games/botw/*.ipa
